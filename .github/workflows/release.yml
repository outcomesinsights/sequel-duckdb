# Publishes sequel-duckdb to rubygems.org when a v* tag is pushed.
#
# To cut a release: bump VERSION in lib/sequel/duckdb/version.rb, update
# Gemfile.lock (`bundle install`) and CHANGELOG.md, land that commit on main,
# wait for CI to go green on it, then push the matching tag:
#   git tag v0.2.1 && git push origin v0.2.1
#
# The FILE NAME is load-bearing: the rubygems.org trusted publisher for
# sequel-duckdb is registered to this repository and `release.yml`, with NO
# environment. Renaming this file, or adding `environment:` to the publish job,
# makes rubygems refuse the token. No API key is stored anywhere.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI runs on pushes to main and on PRs, never on a tag. Without this job, a tag
  # on an untested commit would publish an untested gem, and a yank is the only
  # way back. It fails closed: a tag pushed before CI finishes, or an API error,
  # blocks the release. Re-run this workflow once CI is green.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refuse unless the tag matches Sequel::DuckDB::VERSION
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(ruby -e 'require "./lib/sequel/duckdb/version"; print Sequel::DuckDB::VERSION')
          echo "tag=$TAG version.rb=$version"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match Sequel::DuckDB::VERSION $version; refusing to publish"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Only main ships. Without this, a tag on a pull-request commit would
      # publish code that never landed.
      - name: Require the tagged commit to be on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)
          echo "main relative to $SHA: $status"
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "::error::$SHA is not on main ($status); refusing to publish"
            exit 1
          fi
      # A successful run of the CI workflow FILE, started by a push to main, for
      # exactly this commit. Not any check named `ci`: pull-request runs report
      # that name too, as can any workflow with a job called ci, or anything
      # with statuses:write.
      - name: Require a green CI run from a push to main on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ci=$(gh api "repos/$REPO/actions/workflows/main.yml/runs?head_sha=$SHA&event=push&branch=main" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/main.yml" and .head_sha == env.SHA)]
                  | sort_by(.created_at) | last | (.conclusion // .status // "missing")')
          echo "CI (push to main) on $SHA: $ci"
          if [[ "$ci" != "success" ]]; then
            echo "::error::CI on $SHA is '$ci'. Land the commit on main, let CI pass, then re-run this workflow."
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Required by the OIDC token exchange; scoped to this job only.
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install DuckDB C library
        run: |
          DUCKDB_VERSION=$(grep -P '^\s+duckdb \(' Gemfile.lock | grep -oP 'duckdb \(\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "Installing DuckDB v${DUCKDB_VERSION}"
          wget -q "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip"
          unzip libduckdb-linux-amd64.zip -d libduckdb
          sudo mv libduckdb/duckdb.* /usr/local/include/
          sudo mv libduckdb/libduckdb.so /usr/local/lib/
          sudo ldconfig /usr/local/lib
          rm -rf libduckdb libduckdb-linux-amd64.zip
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      # Cheap here, so run it again against exactly what is about to ship.
      - name: Run the full suite against the tagged commit
        run: bundle exec rake test
      - name: Build the gem
        run: gem build sequel-duckdb.gemspec --output "sequel-duckdb-${VERSION}.gem"
      # The gemspec ships an allowlist of files, so prove the built gem is
      # complete: install it into an empty GEM_HOME and load the adapter from
      # there, not from the checkout.
      - name: Check the built gem loads when installed
        run: |
          set -euo pipefail
          home=$(mktemp -d); empty=$(mktemp -d)
          # Runtime dependencies come from the bundle (vendor/bundle under bundler-cache).
          deps=$(bundle exec ruby -e 'print((Gem.path + [Bundler.bundle_path.to_s]).uniq.join(":"))')
          GEM_HOME="$home" gem install --local --ignore-dependencies --no-document "sequel-duckdb-${VERSION}.gem"
          cd "$empty"
          export GEM_HOME="$home" GEM_PATH="$home:$deps"
          ruby -e '
            gem "sequel-duckdb"; require "sequel"; require "sequel/duckdb"
            dir = Gem.loaded_specs["sequel-duckdb"].gem_dir
            abort "loaded #{dir}, not the built gem" unless dir.start_with?(ENV["GEM_HOME"])
            db = Sequel.mock(host: :duckdb)
            sql = db[:t].where(id: 1).sql
            abort "unexpected SQL from the installed gem: #{sql}" unless sql.include?("WHERE")
            puts "installed gem at #{dir}: #{sql}"'
      # Trusted publishing: exchanges this job's OIDC token for a short-lived
      # rubygems API key.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      # No retry. A failed push fails the run; investigate before re-running.
      - name: Push to rubygems.org
        run: gem push "sequel-duckdb-${VERSION}.gem"
      # The run's colour is not the evidence; the version on rubygems.org is.
      # Compared against THIS release's version, so an older gem cannot pass it.
      # Polled because rubygems' CDN can lag a minute behind the push.
      - name: Confirm rubygems.org serves the new version
        run: |
          for i in $(seq 1 30); do
            latest=$(curl -fsS https://rubygems.org/api/v1/versions/sequel-duckdb/latest.json | jq -r .version || true)
            echo "attempt $i: rubygems latest=$latest"
            [[ "$latest" == "$VERSION" ]] && exit 0
            sleep 10
          done
          echo "::error::rubygems.org still does not report $VERSION as latest"
          exit 1
